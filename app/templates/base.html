<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Library Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .bg-dark-premium { background-color: #11141a !important; }
        .line-height-1 { line-height: 1.1; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-premium border-bottom border-secondary shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase d-flex flex-column line-height-1" href="/" style="letter-spacing: 1px;">
                <span class="fs-5 fw-extrabold text-white" style="font-family: 'Segoe UI', sans-serif;">BERKELEY SCHOOL</span>
                <span class="text-warning fw-semibold text-uppercase" style="font-size: 0.65rem; letter-spacing: 2.5px; margin-top: 2px;">Library Portal</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto align-items-center mt-2 mt-lg-0">
                    <a href="/" class="nav-link px-3 fw-medium text-white-50">Dashboard</a>
                    <a href="/reference" class="nav-link px-3 fw-medium text-white-50 mx-1">Reference Collection</a>
                    <a href="/scholastic" class="nav-link px-3 fw-medium text-white-50 mx-1">Scholastic Collection</a>
                    <a href="/borrowed" class="btn btn-warning btn-sm fw-bold px-3 shadow-sm rounded-pill d-flex align-items-center ms-2 text-dark">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Active Loans
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="footer mt-auto py-3 bg-white border-top text-center">
        <div class="container">
            <span class="text-muted small">&copy; 2026 School Library. Powered by Live Google Sheets API.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
